[project]
name = "cu-openalex"
version = "0.1.0"
description = "Prefect pipeline mining OpenAlex for CU Anschutz authors and their works into Parquet"
readme = "README.md"
authors = [
    { name = "Sean Davis", email = "seandavi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.3",
    "fastexcel>=0.20.2",
    "fsspec>=2026.4.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "polars>=1.41.2",
    "prefect>=3.7.3",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.1",
    "s3fs>=2026.4.0",
    "tenacity>=9.1.4",
    "universal-pathlib>=0.3.10",
]

[project.scripts]
cu-openalex = "cu_openalex.flows.pipeline:main"

[project.optional-dependencies]
dashboard = [
    "google-genai>=2.9.0",
    "networkx>=3.6.1",
    "plotly>=6.8.0",
    "pyvis>=0.3.2",
    "streamlit>=1.58.0",
]
api = [
    "fastapi>=0.136.3",
    "google-genai>=2.9.0",
    "networkx>=3.6.1",
    "uvicorn[standard]>=0.48.0",
]
# Application backend (ADR-0026): the writable overlay + Google OIDC auth that
# runs beside the read-only analytics API. Installed with `api` for the serving
# image when the app tier is enabled; the analytics-only path doesn't need it.
app = [
    "authlib>=1.3.2",
    "google-cloud-secret-manager>=2.20.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary,pool]>=3.2.0",
]
# Build-time only: the cdsci-lake read client (ADR-0023). The host build/grants
# steps source canonical facts from the shared lake through it; the serving `api`
# image never installs or imports it (the lake imports are lazy), staying offline.
lake = [
    "cdsci-lake",
]

[tool.uv.sources]
# Not on PyPI yet — resolve from git (uv.lock pins the exact commit). Switch to a
# plain version spec once it is published to an index.
cdsci-lake = { git = "https://github.com/seandavi/cdsci-lake", branch = "main" }

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI's Query/Path/Depends in argument defaults are the idiomatic pattern,
# not the B008 mutable-default-call anti-pattern.
flake8-bugbear.extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
